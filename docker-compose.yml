version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ticketing_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

    # ✅ Health check (important)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🔥 OPTIONAL (Highly Recommended): Backend container
  backend:
    build: .
    container_name: ticketing_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticketing_db
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata: